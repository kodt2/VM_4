services:
  poisson-sor-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: poisson-sor-web:latest
    container_name: poisson-sor-web
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SOLVER_BINARY_PATH: /app/build/poisson_sor
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
